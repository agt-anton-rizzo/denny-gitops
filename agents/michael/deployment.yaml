apiVersion: apps/v1
kind: Deployment
metadata:
  name: michael
  namespace: denny-agents
  labels:
    app.kubernetes.io/name: michael
    app.kubernetes.io/part-of: denny
    denny.bot/archetype: scrum-master
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: michael
  template:
    metadata:
      labels:
        app.kubernetes.io/name: michael
        app.kubernetes.io/part-of: denny
        denny.bot/archetype: scrum-master
    spec:
      shareProcessNamespace: true
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: agent
          image: docker.io/library/michael-agent:latest
          imagePullPolicy: Never
          command: ["/opt/denny/entrypoint.sh"]
          stdin: true
          tty: true
          envFrom:
            - configMapRef:
                name: michael-config
            - secretRef:
                name: michael-secrets
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "2"
              memory: 2Gi
          volumeMounts:
            - name: home
              mountPath: /home/michael
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: home
          persistentVolumeClaim:
            claimName: michael-home
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 2Gi
