apiVersion: v1
kind: PersistentVolume
metadata:
  name: michael-home
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /opt/denny/agent-data/michael
    type: Directory
  claimRef:
    namespace: denny-agents
    name: michael-home
